name: CI

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: uv pip install --system -e '.[dev]'

      - name: Test
        run: python -m pytest -q

      - name: Schema is in sync with the model
        run: |
          python -m wsprobe.schema /tmp/generated.schema.json || \
            python -c "from wsprobe.schema import write_schema; write_schema('/tmp/generated.schema.json')"
          python - <<'PY'
          import json
          from wsprobe.schema import profile_schema
          on_disk = json.load(open("profile.schema.json"))
          assert on_disk == profile_schema(), "profile.schema.json is stale; run `wsprobe schema`"
          print("schema in sync")
          PY
